name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FALKORDB: falkordb:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Perl
        uses: actions/setup-perl@v1
        with:
          perl-version: '5.42'

      - name: Install cpanminus
        run: |
          curl -L https://cpanmin.us | perl - --sudo App::cpanminus

      - name: Install Perl dependencies
        run: |
          cpanm --notest --installdeps .

      - name: Run tests
        run: |
          # Wait briefly for the FalkorDB service to become available
          for i in $(seq 1 30); do
            if bash -c "echo > /dev/tcp/falkordb/6379" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          # Run the project's test suite using the expected environment variable
          FALKORDB=falkordb:6379 prove -Ilib -lv t/
